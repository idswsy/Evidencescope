name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ══════════════════════════════════════════════════════════════
  # C 端协议测试 —— 保证固件侧的编解码与黄金向量一致
  # ══════════════════════════════════════════════════════════════
  proto-c:
    name: C 协议向量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 重新生成黄金向量并比对
        run: |
          python3 proto/tests/gen_vectors.py > /tmp/vectors_regen.json
          if ! diff -q /tmp/vectors_regen.json proto/tests/vectors.json >/dev/null; then
            echo "::error::vectors.json 与 gen_vectors.py 不同步！"
            echo "本地跑：./proto/run_tests.sh --regen  然后提交"
            diff /tmp/vectors_regen.json proto/tests/vectors.json | head -40
            exit 1
          fi
          echo "✓ 黄金向量与生成脚本一致"

      - name: 编译并运行 C 端测试
        run: make -C proto test

      # 协议真相源的四处同步检查 —— 这是本项目的核心纪律
      - name: 检查协议四处同步
        run: |
          echo "协议契约的四个位置："
          echo "  1. docs/03-protocol.md"
          echo "  2. proto/protocol.h"
          echo "  3. host/crates/proto/src/lib.rs"
          echo "  4. proto/tests/vectors.json"

          # 版本号必须一致
          md_ver=$(grep -oP 'VER_MAJOR:?\s*[:=]?\s*\K\d+' proto/protocol.h | head -1)
          rs_ver=$(grep -oP 'VER_MAJOR: u8 = \K\d+' host/crates/proto/src/lib.rs | head -1)
          json_ver=$(python3 -c "import json;print(json.load(open('proto/tests/vectors.json'))['proto_ver'] >> 4)")

          echo "proto.h=$md_ver lib.rs=$rs_ver vectors.json=$json_ver"
          if [ "$md_ver" != "$rs_ver" ] || [ "$md_ver" != "$json_ver" ]; then
            echo "::error::协议主版本号三处不一致"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════
  # Rust 上位机
  # ══════════════════════════════════════════════════════════════
  host-rust:
    name: Rust 上位机测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      # 串口 crate 在 Linux 上需要 libudev
      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: 格式检查
        run: cargo fmt --all -- --check

      # GUI（scope-gui）单独一个 job：它拉 eframe/winit，Ubuntu 上要额外的
      # 图形系统库，而且编译量大。排除它能让这个 job 保持快且稳。
      - name: Clippy
        run: cargo clippy --workspace --exclude scope-gui --all-targets -- -D warnings

      - name: 测试（含黄金向量的跨语言一致性检查）
        run: cargo test --workspace --exclude scope-gui

  # ══════════════════════════════════════════════════════════════
  # 桌面 GUI —— 单独一个 job，因为它要一整套图形系统库
  # ══════════════════════════════════════════════════════════════
  gui:
    name: GUI 桌面上位机
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      # eframe 官方给出的 Linux 依赖，加上串口要的 libudev。
      #
      # `gcc` 是给 **ring** 装的：AI 分析面板引入的 ureq 走 rustls，
      # 而 rustls 在 Linux 上默认用 ring 做密码学后端 —— ring 里有一段 C 和
      # 汇编，`cc` crate 需要一个真正的 C 编译器才编得过。
      # 运行器上通常自带 gcc，但**不假设**它一定在（本文件里
      # firmware-layering 那个 job 就是这么做的，理由相同）。
      - name: 安装图形系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config gcc \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Clippy
        run: cargo clippy -p scope-gui --all-targets -- -D warnings

      # 只跑单元测试，**不启动窗口** —— CI 是无头机，没有 DISPLAY，
      # 任何 run_native 调用都会失败。视图模型的单测是纯函数，不需要 GUI。
      - name: 视图模型单测（无头）
        run: cargo test -p scope-gui

  # ══════════════════════════════════════════════════════════════
  # 架构纪律 —— ADR-008：App/ 层不许依赖 HAL
  # ══════════════════════════════════════════════════════════════
  firmware-layering:
    name: 固件分层纪律检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: App/ 层不得包含 HAL / 寄存器头文件
        run: |
          # ADR-008：App/ 必须能在 PC 上用 gcc 编译测试，
          # 所以不许直接碰 HAL。破坏了这条，三个人就都得等板子。
          if grep -rn --include='*.c' --include='*.h' \
               -E '#include\s*[<"](stm32[a-z0-9]*|hal_[a-z]*|gd32[a-z0-9]*|HAL)\.?h?[>"]' \
               firmware/App/ 2>/dev/null; then
            echo "::error::firmware/App/ 出现了对 HAL/寄存器的直接依赖（违反 ADR-008）"
            echo "硬件访问必须经 firmware/Hardware/ 的抽象接口"
            exit 1
          fi
          echo "✓ App/ 层保持硬件无关"

      # 上一条只是 grep 兜底；**这一条才是真正的验收** ——
      # 真把 App/ 编译一遍。App/ 一旦真的依赖了 HAL，include 路径里
      # 没有那些头，这里直接编译不过。比 grep 可靠：grep 挡不住
      # 间接依赖、宏、或者换个写法的 include。
      - name: 在 PC 上编译并运行 App/ 的测试
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          ./firmware/run_tests.sh

      # ⚠ 真机的栈只有 1024 B（`MDK-ARM/startup_stm32f103xb.s` 的
      # `Stack_Size EQU 0x400`），而上面那条 `run_tests.sh` 跑在 PC 上，
      # 宿主的栈有好几 MB —— **这一类的栈越界只有真机才炸**，而且不报错：
      # 栈往下依次是堆（512 B）、C 库的 libspace、然后是 ZI 段，
      # 越界会**静默改写**它们，症状是别的变量莫名其妙变值。
      #
      # 2026-10-05 的实例：`proto_task.c` 的 `cmd_read_buffer` 里
      # `uint8_t buf[12 + 1024*2]` 是 **2060 B** 的局部数组，越界 1036 B。
      # 改 `static` 后 App/ 最大的栈帧从 2192 B 降到 240 B。
      #
      # 只量 `firmware/App/`：它是纯 C（ADR-008 保证宿主编得过）；
      # `Hardware/src/adc_dma.c` 有 ARM 内联汇编，x86 的 gcc 编不了。
      - name: App/ 单帧栈预算（宿主栈抓不到的越界）
        run: |
          BUDGET=512   # 真机栈 1024 B 的一半：任何单帧都得给调用者留位
          rm -rf /tmp/su && mkdir -p /tmp/su
          n=0
          for f in firmware/App/*.c; do
            # 编译失败就没有 .su 文件。**必须显式判失败**，否则这条检查
            # 会因为「量不到东西」而静默变绿 —— 本项目已经栽过两次。
            # （这里的 `-w` 只是不想看警告；错误仍然会让 gcc 非零退出。）
            gcc -fstack-usage -c -O1 -w -Ifirmware/App -Iproto "$f" \
                -o "/tmp/su/$(basename "$f" .c).o" \
              || { echo "::error file=$f::量不到栈帧（-fstack-usage 编译失败）"; exit 1; }
            n=$((n + 1))
          done
          got=$(ls /tmp/su/*.su 2>/dev/null | wc -l)
          if [ "$got" -ne "$n" ]; then
            echo "::error::.su 文件 $got 个，源文件 $n 个 —— 测量不完整"
            exit 1
          fi
          # 失败必须**显式**判：`run:` 块的默认 shell 带 `-e`，
          # 但依赖它是隐式的 —— 本地不带 `-e` 复现时行为不同（踩过）。
          if cat /tmp/su/*.su | awk -F'\t' -v b="$BUDGET" '
               $2 > b { bad = 1; printf "::error file=%s::栈帧 %s B，超过 %d B 预算\n", $1, $2, b }
               { if ($2 > max) { max = $2; who = $1 } }
               END { printf "  最大栈帧 %d B @ %s（预算 %d B）\n", max, who, b;
                     if (bad) exit 1 }'; then
            echo "✓ App/ 没有超过 ${BUDGET} B 的单帧"
          else
            echo "::error::App/ 有单帧超出 ${BUDGET} B —— 真机栈只有 1024 B，且溢出是静默的"
            exit 1
          fi

      # 上面那条是「App/ 不许碰 HAL」的验收；这一条是它的**反面** ——
      # Hardware/ 与 Core/ 本来就该碰 HAL，所以要带着 HAL 包含路径编一遍。
      #
      # 为什么必需：`Hardware/src/scope_ui.c`（上游那套本机显示+按键逻辑）
      # 在 `SCOPE_LOCAL_UI=0` 时**整个文件被 `#if` 关掉、不参与 Keil 构建**，
      # 所以它不会因为编译失败而被人发现 —— 会一直烂到 P4 要用的时候。
      # 这里两种开关都编一遍，它就没有腐烂的机会。
      #
      # `-w` 关掉警告：宿主是 64 位而目标是 ARM，CMSIS 里
      # `(uint32_t *)SCB->VTOR` 这类 `-Wint-to-pointer-cast` 是**必然**的，
      # 与本工程无关。只看**退出码**，只有真错误才算失败。
      - name: 硬件层语法检查（含默认关闭的本机 UI）
        run: |
          INC="-Ifirmware/Core/Inc -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc"
          INC="$INC -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc/Legacy"
          INC="$INC -Ifirmware/Drivers/CMSIS/Device/ST/STM32F1xx/Include"
          # App/ 提供 hal.h（环大小等常量的单一真相源），proto/ 提供采样率量化。
          # ⚠ proto/ 在仓库根，不在 firmware/ 下。
          INC="$INC -Ifirmware/Drivers/CMSIS/Include -Ifirmware/Hardware/inc"
          INC="$INC -Ifirmware/App -Iproto"
          DEF="-DUSE_HAL_DRIVER -DSTM32F103xB"
          fail=0
          for ui in 0 1; do
            for f in firmware/Core/Src/*.c firmware/Hardware/src/*.c; do
              if ! gcc -fsyntax-only -w -std=c11 $DEF -DSCOPE_LOCAL_UI=$ui $INC "$f"; then
                echo "::error file=$f::语法检查失败（SCOPE_LOCAL_UI=$ui）"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ 硬件层在 SCOPE_LOCAL_UI=0 与 =1 两种开关下都编得过"

      # ⚠ 上面那条是 `-fsyntax-only`，**不做链接** —— 它抓不到「两个 .c 定义了
      #   同一个 HAL 回调」这类跨文件重定义。而这一类在本仓是真会发生的：
      #   `Hardware/src/scope_ui.c`（上游本机 UI 的存档）与
      #   `Hardware/src/adc_dma.c` 都定义 `HAL_ADC_ConvCpltCallback`。
      #
      # 后者才是真正要防的：`scope_ui.c` 那个回调会 `HAL_ADC_Stop_DMA`，
      # 一旦被链接进构建，采集链会被它**静默掐死**。ADR-014 决定它是存档、
      # 永不启用，所以这里直接盯住「有没有人把它加进 Keil 工程」——
      # 比泛泛地 grep 重名精确得多。
      - name: HAL 回调归属（scope_ui.c 不得进构建；已构建文件之间不得重名）
        run: |
          if grep -q 'scope_ui\.c' firmware/MDK-ARM/*.uvprojx; then
            echo "::error file=firmware/Hardware/src/scope_ui.c::scope_ui.c 被加进了 Keil 工程。"
            echo "它重定义了 HAL_ADC_ConvCpltCallback（与 Hardware/src/adc_dma.c 冲突），"
            echo "而且那个回调会调 HAL_ADC_Stop_DMA —— 采集链会被它静默掐死。见 ADR-014。"
            exit 1
          fi
          echo "✓ scope_ui.c 仍是存档状态，没有进构建"
          # 会进构建的源文件里，同一个 HAL 回调只能有一个定义。
          build_src=$(ls firmware/Hardware/src/*.c firmware/Core/Src/*.c | grep -v 'scope_ui\.c')
          dup=$(grep -hoE 'void[[:space:]]+HAL_[A-Za-z0-9_]+Callback' $build_src \
                | awk '{print $2}' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::这些 HAL 回调被多于一个文件定义：$dup"
            echo "需要多人响应同一个回调时，由 owner 转发（见 firmware/README.md 的归属表）。"
            exit 1
          fi
          echo "✓ 已构建文件之间没有重复的 HAL 回调定义"

      # ⚠ 2026-10-06 真机踩到：**`local_gen.c` 写好了、测试也过了，却没被加进
      #   Keil 工程** —— 症状是链接期一串 `Undefined symbol LocalGen_*`。
      #
      # 根因是**竞态**：Keil 把工程常驻内存，编辑 `.uvprojx` 之后只要 Keil 一保存
      # （Rebuild、翻选项、关窗口都可能触发），外部改动就被整个冲掉。
      # 前六轮加的 6 个文件都进去了，唯独漏掉最后一个 —— 因为那次编辑发生在
      # Keil 载入工程**之后**。
      #
      # 所以这条**不能只靠"记得加"**。
      - name: 每个该进构建的源文件都在 Keil 工程里
        run: |
          fail=0
          for f in firmware/App/*.c firmware/Hardware/src/*.c; do
            b=$(basename "$f")
            [ "$b" = "scope_ui.c" ] && continue   # 上游存档，故意不编（ADR-014）
            [ "$b" = "display.c" ] && continue    # 屏幕已冻结（docs/09 §4.4），代码保留不编
            if ! grep -q ">$b<" firmware/MDK-ARM/*.uvprojx; then
              echo "::error file=$f::$b 没有被加进 Keil 工程。"
              echo "后果是链接期一串 Undefined symbol，而不是编译错误 —— 很容易以为是代码写错。"
              echo "在 Keil 里右键 Application/App 或 Application/Hardware 组 → Add Existing Files。"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ 所有该进构建的源文件都在 Keil 工程里"

      # ⚠ 「用到 NULL 就必须显式 include」这一类**不需要单独的 lint** ——
      #   上面那条严格 C99 检查加了 `-ffreestanding` 之后已经把它整个覆盖了，
      #   而且覆盖的是一整类「宿主头文件比 ARMCC5 宽松」的差异，
      #   不止 NULL 一个标识符。**别在这里再加一条更弱的重复检查。**

      # 上面那条用 gcc 默认的 C11 编；**这条用严格 C99 编**。
      #
      # 为什么必需：Keil MDK5 用的 **ARMCC5 没有 C11 模式**（只有 C90/C99），
      # 而 `proto/protocol.h` 里有 C11 的 `_Static_assert`。
      # 2026-10-05 把 `proto/` 加进 Keil 包含路径后，固件工程一次炸出 30 个错。
      #
      # ⚠ 两个坑，都是变异测试试出来的，别把它们改回去：
      #
      #   1. **`-std=c99` 单独用抓不到** —— gcc 把 `_Static_assert` 当扩展收下了。
      #      必须带 `-pedantic-errors`，那才是 ARMCC5 的严格 C99。
      #   2. **绝对不能加 `-w`** —— 它会把 `-pedantic-errors` 的诊断一起关掉，
      #      于是这条检查永远通过、形同虚设。第一版就是这么写的。
      #      宿主的 64 位警告改用针对性的 `-Wno-int-to-pointer-cast` 压。
      - name: Keil 兼容性：严格 C99（ARMCC5 没有 C11）
        run: |
          INC="-Ifirmware/Core/Inc -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc"
          INC="$INC -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc/Legacy"
          INC="$INC -Ifirmware/Drivers/CMSIS/Device/ST/STM32F1xx/Include"
          INC="$INC -Ifirmware/Drivers/CMSIS/Include -Ifirmware/Hardware/inc"
          INC="$INC -Ifirmware/App -Iproto"
          DEF="-DUSE_HAL_DRIVER -DSTM32F103xB"
          # ⚠ `-Werror=comment`：块注释里再出现注释起始符时，ARMCC5 会对
          #   **每一个**包含该头的 .c 各报一次 `#9-D: nested comment is not allowed`。
          #   2026-10-05 的 Keil Rebuild 报了 4 条，全部来自 usart.h 同一行里
          #   连写的路径分隔符。**上面那条 C11 检查带 `-w`，抓不到这一类。**
          WARN="-Werror=comment -Wno-int-to-pointer-cast -Wno-pointer-to-int-cast"
          # ⚠ **`-ffreestanding` 不是修辞，它挡的是真发生过的一类错。**
          #
          # 2026-10-05 真机编译：ARMCC5 报 `#20: identifier "NULL" is undefined`
          # 四处，而本机 gcc 与 CI 的 Ubuntu runner **都放行** ——
          # `__STDC_HOSTED__=1` 时 gcc 的 `<stdint.h>` 会 `#include_next` 宿主那份，
          # 而宿主那份传递引入了 `<stddef.h>`；ARMCC5 的 `<stdint.h>` 不会。
          #
          # `-ffreestanding` 把 `__STDC_HOSTED__` 置 0，gcc 改用自带的
          # `stdint-gcc.h`（不引入 stddef）—— 于是**复现 ARMCC5 的严格性**。
          # 实测：同一个缺 `#include <stddef.h>` 的文件，不加这个开关通过、
          # 加了就报错（gcc 还会直接提示该 include 哪个头）。
          #
          # 这是「宿主的头文件比目标宽松」这一类，与栈大小、DMA 行为同族：
          # **在主机上怎么编都看不出来**。
          fail=0
          for f in proto/protocol.c firmware/App/*.c firmware/Hardware/src/*.c firmware/Core/Src/*.c; do
            if ! gcc -fsyntax-only -std=c99 -pedantic-errors -ffreestanding $WARN $DEF $INC "$f"; then
              echo "::error file=$f::不满足严格 C99（Keil 的 ARMCC5 只有 C90/C99）"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ 全部源文件满足严格 C99 —— Keil 那边不会因为语言标准炸"
          echo "✓ 块注释内没有嵌套的注释起始符（ARMCC5 的 #9-D）"

      # ⚠ 2026-10-06 真机 Keil 报了
      #   `#177-D: function "fmt_u32" was declared but never referenced`
      #   —— 重写 `display.c` 的格式化函数时留下了死代码，而**在那之前一直是
      #   0 warning**，所以没有任何一步检查抓到它。
      #
      # ⚠ **抓它必须用 `-S`，不能用 `-fsyntax-only`。** 这类警告在**代码生成**
      #   阶段才发；实测同一份文件：`-fsyntax-only` 通过、`-c` 报错。
      #
      # 为什么是 `-S` 而不是更直觉的 `-c`：`Hardware/src/adc_dma.c` 与
      # `Core/Src/main.c` 里有 **ARM 内联汇编**（`cpsid i` / `mrs primask`），
      # x86 的汇编器不认，`-c` 会在这里断掉 —— 于是那两个文件**静默地没被检查**。
      # `-S` 只产出汇编、不调用汇编器，刚好停在代码生成之后。
      - name: 死代码：未引用的静态函数 / 变量（ARMCC5 会报 #177-D）
        run: |
          INC="-Ifirmware/Core/Inc -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc"
          INC="$INC -Ifirmware/Drivers/STM32F1xx_HAL_Driver/Inc/Legacy"
          INC="$INC -Ifirmware/Drivers/CMSIS/Device/ST/STM32F1xx/Include"
          INC="$INC -Ifirmware/Drivers/CMSIS/Include -Ifirmware/Hardware/inc"
          INC="$INC -Ifirmware/App -Iproto"
          DEF="-DUSE_HAL_DRIVER -DSTM32F103xB"
          W="-Werror=unused-function -Werror=unused-variable -Werror=unused-but-set-variable"
          fail=0
          for ui in 0 1; do
            for f in proto/protocol.c firmware/App/*.c firmware/Hardware/src/*.c firmware/Core/Src/*.c; do
              if ! gcc -S -O1 -std=c99 $W $DEF -DSCOPE_LOCAL_UI=$ui \
                     -Wno-int-to-pointer-cast -Wno-pointer-to-int-cast \
                     $INC "$f" -o /dev/null 2>/tmp/deadcode.txt; then
                grep -v 'core_cm3\.h\|CMSIS' /tmp/deadcode.txt | head -5
                echo "::error file=$f::有未引用的静态函数/变量 —— Keil 会报 #177-D，而目标一直是 0 warning"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ 没有未引用的静态函数 / 变量"

      # ⚠ 这个坑是**静默**的，必须由 CI 兜住。
      #
      # 在 Windows 上提交脚本时，git 默认不跟踪可执行位（core.fileMode=false），
      # 文件会以 100644 入库。本地跑 `./xxx.sh` 照样能跑（Windows 不看那个位），
      # **只有在 Linux runner 上才炸**：`Permission denied`。
      #
      # 回归：`firmware/run_tests.sh` 就是这么进来的 —— CI 从加入它的那次合并
      # 起连红三轮（240006d / 37c44a8 / b39b8c0），而本地完全复现不出来。
      - name: 检查 CI 调用的脚本有可执行位
        run: |
          # 查的是 **git 索引里的模式**，不是文件系统上的 `-x`。
          # 两头都重要：Windows 的 Git Bash 会把所有文件都报成可执行，
          # 用 `[ -x ]` 在本地既能通过、又说明不了 runner 上会怎样。
          # 索引里的 100755 / 100644 在两端是同一个值 —— 所以这条
          # **本地就能验**，包括故意改回 100644 看它会不会红。
          missing=0
          for s in $(grep -oP '^\s*\./\K\S+\.sh' .github/workflows/ci.yml | sort -u); do
            mode=$(git ls-files -s -- "$s" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error file=$s::CI 用 ./ 调用 $s，但它在 git 里是 ${mode:-（未跟踪）}，不是 100755"
              echo "  在 Linux runner 上会 Permission denied。修：git update-index --chmod=+x $s"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ CI 调用的脚本都有可执行位"

      - name: 检查关键文档存在
        run: |
          for f in docs/03-protocol.md docs/04-performance.md proto/tests/vectors.json; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          echo "✓ 关键文档齐全"

  # ══════════════════════════════════════════════════════════════
  # 端到端冒烟 —— 对着模拟器跑一次完整采集
  # ══════════════════════════════════════════════════════════════
  e2e-smoke:
    name: 端到端冒烟（模拟器）
    runs-on: ubuntu-latest
    needs: [host-rust]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: 采集一次并检查输出
        run: |
          cargo run -q -p scope-cli -- sim capture --scenario sine_1k_3v3 -n 1024 -o /tmp/wave.csv
          test -s /tmp/wave.csv || { echo "::error::CSV 为空"; exit 1; }
          lines=$(wc -l < /tmp/wave.csv)
          [ "$lines" -eq 1026 ] || { echo "::error::CSV 行数应为 1026（速率注释 + 表头 + 1024 点），实际 $lines"; exit 1; }
          head -1 /tmp/wave.csv | grep -q '^# rate_hz=857142' || { echo "::error::CSV 首行缺少精确速率"; exit 1; }
          sed -n '2p' /tmp/wave.csv | grep -q 'Time(s)' || { echo "::error::CSV 表头错误"; exit 1; }
          echo "✓ 端到端采集产出 1024 点"

      - name: I2C 场景双通道
        run: |
          cargo run -q -p scope-cli -- sim capture --scenario i2c_100k -n 2048 -o /tmp/i2c.csv
          test -s /tmp/i2c.csv || { echo "::error::I2C CSV 为空"; exit 1; }
          head -1 /tmp/i2c.csv | grep -q 'CH2V' || { echo "::error::应为双通道"; exit 1; }
          echo "✓ I2C 双通道采集成功"

      - name: CLI 测量命令
        run: |
          out=$(cargo run -q -p scope-cli -- sim measure --scenario sine_1k_3v3 -n 4096)
          echo "$out"
          echo "$out" | grep -q 'Vpp=' || { echo "::error::测量未输出 Vpp"; exit 1; }
          # 4096 点 @857 kSPS = 4.78 ms，覆盖约 4.8 个 1 kHz 周期 —— 频率必须测得出。
          # （1024 点只有 1.19 ms，不足一个完整周期，频率会报「测不出」，那是正确行为，
          #   所以这条特意用 4096 点，否则测不出与测量坏了分不开。）
          echo "$out" | grep -q '频率=1000' || { echo "::error::1 kHz 正弦的频率测量不对"; exit 1; }
          echo "✓ CLI 测量输出 Vpp 与正确的频率"

      - name: MCP 自检
        run: cargo run -q -p scope-mcp -- --selftest

      # docs/05-roadmap.md 的「MCP 工具清单」是 TOOLS 常量的**人读镜像**，
      # 文档自己写着「改一处必须改两处」—— 但在此之前没有任何东西守着它。
      # 这跟协议那四处用的是同一种纪律：镜像会腐烂，所以让 CI 盯着。
      - name: 检查 MCP 工具名清单与实现一致
        working-directory: .
        run: |
          cargo run -q --manifest-path host/Cargo.toml -p scope-mcp -- --list-tools \
            | grep -oP '^── \Kscope_[a-z_]+' | sort -u > /tmp/impl_tools.txt
          grep -oP '^\| `\Kscope_[a-z_]+' docs/05-roadmap.md | sort -u > /tmp/doc_tools.txt
          echo "实现 $(wc -l < /tmp/impl_tools.txt) 个 / 文档 $(wc -l < /tmp/doc_tools.txt) 个"
          if ! diff -u /tmp/doc_tools.txt /tmp/impl_tools.txt; then
            echo "::error::docs/05-roadmap.md 的工具清单与 scope-mcp 的 TOOLS 常量不一致"
            exit 1
          fi
          echo "✓ 工具名清单一致（说明文字仍需人工同步）"

      # README 的「模拟器场景（15 个）」表是 Scenario::name 的**人读镜像** ——
      # 加场景时最容易漏的就是它（代码有三处编译期/测试期强制点，文档一处
      # 都没有）。与上面那条同一个道理：镜像会腐烂，让 CI 盯着。
      #
      # **顺序也查**：README 表里故意按 ALL 的顺序排，diff 不做排序比较。
      - name: 检查模拟器场景表与实现一致
        working-directory: .
        run: |
          grep -oP '^\| `\K[a-z0-9_]+(?=`)' README.md \
            | grep -vE '^(serial|sim)$' > /tmp/doc_scen.txt
          grep -oP 'Scenario::\w+ => "\K[a-z0-9_]+' \
            host/crates/sim/src/waveform.rs > /tmp/impl_scen.txt
          echo "实现 $(wc -l < /tmp/impl_scen.txt) 个 / README $(wc -l < /tmp/doc_scen.txt) 个"
          if ! diff -u /tmp/doc_scen.txt /tmp/impl_scen.txt; then
            echo "::error::README.md 的模拟器场景表与 Scenario::name 不一致（含顺序）"
            exit 1
          fi
          test "$(wc -l < /tmp/impl_scen.txt)" -eq 15 \
            || { echo "::error::场景数不是 15 —— 表头写的数字也要改"; exit 1; }
          echo "✓ 场景表一致（15 个，顺序与 ALL 相同）"
